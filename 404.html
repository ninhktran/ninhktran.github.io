<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0d1110">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; form-action 'none'">
  <title>Page Not Found - Ninh Tran</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header class="site-header is-scrolled">
    <div class="container header-inner">
      <a class="brand" href="/" aria-label="Ninh Tran home">
        <span class="brand-mark">NT</span>
        <span>Ninh Tran</span>
      </a>
    </div>
  </header>

  <main class="not-found" aria-labelledby="not-found-title">
    <div class="container">
      <p class="eyebrow"><span class="eyebrow-dot"></span> 404 / Page not found</p>
      <h1 id="not-found-title">That route <em>doesn't exist.</em></h1>
      <p class="hero-lede">The page may have moved, or the link may be pointing at an old idea.</p>
      <a class="button button-primary" href="/">Return home <span aria-hidden="true">&#8599;</span></a>
    </div>
  </main>
</body>
</html>
